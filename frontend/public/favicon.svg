<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Roundel neutre : plus de couleur ni de numéro de ligne (l'appli couvre les 16 lignes
       du métro, pas une ligne en particulier). Le motif évoque un réseau de stations reliées
       par des tracés plutôt qu'une ligne précise ; gris ardoise sobre, lisible à 16 px. -->
  <circle cx="16" cy="16" r="15" fill="#37474F" />
  <path d="M7 20 L14 12 L18 16 L25 9" fill="none" stroke="#fff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="7" cy="20" r="2.4" fill="#fff" />
  <circle cx="14" cy="12" r="2.4" fill="#fff" />
  <circle cx="18" cy="16" r="2.4" fill="#fff" />
  <circle cx="25" cy="9" r="2.4" fill="#fff" />
</svg>
