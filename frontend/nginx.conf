# `proxy_set_header` remplace : sans ce map, un terminateur TLS placé devant aurait beau envoyer
# « https », le backend recevrait le $scheme de nginx, c'est-à-dire « http ».
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# limit_req_zone n'est valide qu'au niveau `http` — ce fichier étant inclus depuis conf.d/, on y
# est. 10 Mo tiennent de l'ordre de 160 000 adresses.
#
# Second rideau seulement : le quota qui fait foi est dans le backend, seul point présent dans
# les trois topologies visées (compose, Ingress Kubernetes, conteneurs serverless — cf. spec
# SEC-3 § 2.1). Ici, 10 r/s est le même ordre de grandeur que ses 600/min, mais l'algorithme
# diffère (seau percé contre fenêtre fixe) : les deux ne déclencheront pas au même instant, sans
# conséquence dans la pile compose seule.
#
# Réserve : la clé est $binary_remote_addr, sans `set_real_ip_from`/`real_ip_header`. Derrière un
# terminateur TLS (cf. README « Mise en ligne »), cette adresse vaut celle du terminateur pour
# tout le monde — la zone devient un budget partagé par l'ensemble des usagers, pas un quota par
# IP. Remède à poser quand le CIDR du terminateur sera connu :
# `set_real_ip_from <CIDR>; real_ip_header X-Forwarded-For;`
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 8080;
  server_tokens off;

  # Même include que chaque location ci-dessous, mais celui-ci couvre les erreurs émises AVANT
  # qu'un location soit choisi (ex. 400 Request Header Or Cookie Too Large) : sans lui, ces
  # réponses sortiraient sans aucun en-tête de sécurité. Pas un doublon : chaque location cesse
  # d'hériter de l'add_header du niveau server dès qu'il pose le sien.
  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets hachés par Vite : leur nom change avec leur contenu, donc ils sont immuables. Pas de
  # repli sur index.html ici — un asset absent doit répondre 404, pas du HTML déguisé en script.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  # `proxy_pass` SANS slash final : il transmet l'URI complète, /api étant le context-path du
  # backend. Et aucun Cache-Control ici — `add_header` ajoute au lieu de remplacer, donc en poser
  # un doublerait celui que le backend envoie déjà sur /network.
  location /api/ {
    include /etc/nginx/security-headers.conf;
    # Pas sur /assets/ ni sur / : les fichiers statiques coûtent peu et sont déjà cachés un an,
    # les limiter ne protégerait rien et gênerait un rechargement forcé.
    limit_req zone=api burst=60 nodelay;
    # nginx répond 503 par défaut, ce qui dirait « le service est en panne » au lieu de « tu vas
    # trop vite ».
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_pass http://backend:8100;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
