# Inclus par CHAQUE bloc `location`, et ce n'est pas une maladresse : dès qu'un `location` pose
# son propre `add_header`, nginx cesse d'hériter de ceux du serveur. Les poser une seule fois au
# niveau `server` ferait disparaître toute la sécurité des réponses de /assets/ — silencieusement,
# puisque ce bloc a son propre Cache-Control.
#
# `always` : les en-têtes doivent couvrir aussi les réponses d'erreur (404, 502).
#
# Chaque directive de la CSP est justifiée par une mesure au § 3 de
# docs/superpowers/specs/2026-07-31-sec-4-entetes-securite-tls-design.md. Ne pas « simplifier » :
# le triple `style-src` est un repli pour les navigateurs sans style-src-elem/-attr.
# `worker-src 'self'` : mesure invalidée par la montée MapLibre 4 → 6 (QUA-5). En v4, la mesure du
# § 3 tenait (« MapLibre ne charge jamais de worker par URL », deux `createObjectURL`) : `blob:`
# seul suffisait. MapLibre 6 est ESM-only ; il repère son propre worker via `import.meta.url`, ce
# qui ne survit pas au bundler — `MapView.tsx` fixe donc l'URL explicitement via `setWorkerUrl`, et
# cette URL est un asset `/assets/maplibre-gl-worker-*.js` de même origine, pas un blob. `blob:` est
# conservé en repli (chemin cross-origin de MapLibre, inutilisé ici mais inoffensif). `child-src`
# suit `worker-src` pour la même raison : c'est le repli des moteurs qui ignorent `worker-src`
# (Safari < 15.5, Firefox < 58), qui sans lui retomberaient sur `default-src 'none'`.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; child-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# À rouvrir pour UX-5 (« trains autour de moi »), qui aura besoin de geolocation=(self).
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Ignoré par les navigateurs sur une origine http: — sans effet aujourd'hui, correct le jour où un
# terminateur TLS est devant (cf. README, section mise en ligne).
add_header Strict-Transport-Security "max-age=31536000" always;
