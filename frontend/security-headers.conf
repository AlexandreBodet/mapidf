# Inclus par CHAQUE bloc `location`, et ce n'est pas une maladresse : dès qu'un `location` pose
# son propre `add_header`, nginx cesse d'hériter de ceux du serveur. Les poser une seule fois au
# niveau `server` ferait disparaître toute la sécurité des réponses de /assets/ — silencieusement,
# puisque ce bloc a son propre Cache-Control.
#
# `always` : les en-têtes doivent couvrir aussi les réponses d'erreur (404, 502).
#
# Chaque directive de la CSP est justifiée par une mesure au § 3 de
# docs/superpowers/specs/2026-07-31-sec-4-entetes-securite-tls-design.md. Ne pas « simplifier » :
# le triple `style-src` est un repli pour les navigateurs sans style-src-elem/-attr.
# `worker-src 'self'` : mesure refaite pour la montée MapLibre 4 → 6 (QUA-5). En v4, la mesure du
# § 3 tenait (« MapLibre ne charge jamais de worker par URL », deux `createObjectURL`) : `blob:`
# seul suffisait. MapLibre 6 est ESM-only et charge son worker par une vraie URL same-origin
# (`config.WORKER_URL`, posée par `setWorkerUrl` dans `MapView.tsx`, résout vers l'asset
# `/assets/maplibre-gl-worker-*.js`) : `web_worker.ts` compare cette URL à `location.origin` et ne
# passe JAMAIS par blob quand elles coïncident — ce qui est toujours le cas ici, en dev comme en
# prod. `blob:` retiré : il n'est plus jamais emprunté, et sous `default-src 'none'` c'était de la
# défense en profondeur perdue pour rien (offrirait `new Worker(URL.createObjectURL(...))` à qui
# obtiendrait une injection). `child-src 'self'` suit `worker-src` pour la même raison que
# documentée : repli des moteurs qui ignorent `worker-src` (Safari < 15.5, Firefox < 58), qui sans
# lui retomberaient sur `default-src 'none'`. Mais `child-src` couvre AUSSI le cadrage
# (`<iframe>`), que l'ancien `blob:` fermait de fait (une iframe injectée ne sert jamais du
# `blob:`) et que `'self'` rouvrirait tout seul ; `frame-src 'none'` referme précisément ce
# cadrage sans toucher au repli worker — CSP niveau 1, donc compris par les mêmes vieux moteurs.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; child-src 'self'; worker-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# À rouvrir pour UX-5 (« trains autour de moi »), qui aura besoin de geolocation=(self).
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Ignoré par les navigateurs sur une origine http: — sans effet aujourd'hui, correct le jour où un
# terminateur TLS est devant (cf. README, section mise en ligne).
add_header Strict-Transport-Security "max-age=31536000" always;
