server:
  servlet:
    context-path: /api
  port: 8000
management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: MapIDF
  datasource:
    url: jdbc:postgresql://localhost:5432/mapidf
    username: mapidf
    password: mapidf
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  line:
    # Ligne 9 du métro (vérifié sur données réelles) — route_id du GTFS IDFM
    gtfs-route-id: "IDFM:C01379"
    siri-line-ref: "STIF:Line::C01379:"   # LineRef SIRI de la ligne 9
    color: "#D2D200"                       # route_color GTFS de la ligne 9
  prim:
    api-key: ${PRIM_API_KEY:}
    auth-header: "apikey"
    # GTFS IDFM complet (~109 Mo) ; le loader filtre en streaming la seule ligne cible.
    # Miroir open data STIF ; remplaçable par l'export data.iledefrance-mobilites.fr.
    gtfs-static-url: "https://eu.ftp.opendatasoft.com/stif/GTFS/IDFM-gtfs.zip"
    realtime-base-url: "https://prim.iledefrance-mobilites.fr/marketplace/requete-ligne"
    # PRIM actualise ces données 1×/minute et le quota par ligne est ~1000 appels/jour ;
    # inutile (et coûteux) de poller plus vite. Un seul poll sert tous les clients
    # (le front tweene entre deux snapshots et le backend recalcule la position à chaque requête).
    poll-interval: PT60S
