server:
  servlet:
    context-path: /api
  port: 8000
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 4096
management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
spring:
  config:
    # Couvre `./mvnw spring-boot:run`, seul chemin qui ne lit pas le .env seul. `optional:` car
    # le fichier n'existe pas dans l'image ; `[.properties]` pour un fichier sans extension.
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  threads:
    virtual:
      enabled: true
  application:
    name: MapIDF
  datasource:
    # Aucune valeur par défaut : rien ici ne doit pouvoir suivre le code jusqu'en prod. Tout
    # vient du .env (local) ou de l'environnement (Docker, prod).
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  network:
    # route_type GTFS suivis. Mesuré le 2026-07-29 : route_type=1 donne exactement les
    # 16 lignes de métro, une par ligne commerciale. Passer au tram = ajouter TRAM.
    modes: [METRO]
    # route_id à écarter (ligne dont la dérivation du LineRef SIRI échouerait).
    exclude: []
  prim:
    api-key: ${PRIM_API_KEY}
    auth-header: "apikey"
    # GTFS IDFM complet (~125 Mo au 2026-07-30, il grossit) ; le loader filtre en streaming le
    # périmètre défini par app.network.modes/exclude ci-dessus — ce n'est plus une seule ligne
    # cible depuis le multi-lignes.
    # Miroir open data STIF ; remplaçable par l'export data.iledefrance-mobilites.fr.
    gtfs-static-url: "https://eu.ftp.opendatasoft.com/stif/GTFS/IDFM-gtfs.zip"
    # SIRI-ET "requête globale" : un seul appel couvre TOUT le réseau (indexé par ligne
    # côté backend). Le coût quota devient indépendant du nombre de lignes suivies.
    # Le poller appelle ce endpoint sans ?LineRef= et ingère tout le réseau ; la restriction
    # aux lignes suivies se fait à l'indexation.
    realtime-base-url: "https://prim.iledefrance-mobilites.fr/marketplace/estimated-timetable"
    # Données rafraîchies 1×/minute → PT60S suffit. Le poller ne tourne que pendant les
    # heures de service métro (~05h30–01h30, cf. RealtimePoller.inServiceHours), soit ~1200
    # appels/jour : tenir sous le quota estimated-timetable (relever à 1500/j côté PRIM).
    # Un seul poll sert tous les clients (le front tweene entre deux snapshots).
    poll-interval: PT60S
    # Perturbations : un seul appel couvre tout le réseau (mesuré le 2026-07-30 : 1029
    # perturbations, 1,53 Mo → 288 Ko en gzip). SIRI general-message a été écarté — il renvoie
    # InfoMessage vide pour le métro et exige un paramètre par ligne.
    disruptions-url: "https://prim.iledefrance-mobilites.fr/marketplace/disruptions_bulk/disruptions/v2"
    # Une perturbation vit des heures ou des semaines : la minute n'apporte rien, et c'est un
    # quota distinct de celui du temps réel.
    disruptions-poll-interval: PT5M
