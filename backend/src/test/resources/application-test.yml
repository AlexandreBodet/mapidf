# Le profil "test" (cf. @MapIdfTest) doit être hermétique. Sans ce fichier, @EnableScheduling
# déclenche GtfsStaticService.refresh() avec initialDelay=0, qui télécharge les 109 Mo du GTFS
# IDFM réel, et RealtimePoller.poll(), qui appelle PRIM — les deux échouant silencieusement
# dans leur try/catch. Un refresh de fond écraserait en plus le LineRegistry en pleine IT.
# Les deux méthodes sortent immédiatement quand leur URL est vide.
#
# Ce fichier remplace l'ancien backend/src/main/resources/application-test.yml (supprimé) :
# les deux portaient le même nom classpath:/application-test.yml et se shadowaient
# silencieusement (seul celui du classpath de test était résolu).
spring:
  datasource:
    # Testcontainers fournit la vraie connexion (@ServiceConnection) ; ces valeurs n'existent que
    # pour satisfaire ConfigurationGuard, qui refuse de démarrer sur une configuration absente.
    # Sans elles, les tests exigeraient un .env — donc ne passeraient pas sur un autre poste.
    url: "jdbc:postgresql://localhost:5432/remplacé-par-testcontainers"
    username: "test-not-a-secret"
    password: "test-not-a-secret"
app:
  prim:
    gtfs-static-url: ""
    realtime-base-url: ""
    # Même raison : DisruptionPoller.poll sort immédiatement sur une URL vide, donc aucun appel
    # PRIM depuis les tests.
    disruptions-url: ""
    disruptions-poll-interval: PT5M
    api-key: "test-key-not-a-secret"
  network:
    modes: [METRO]
    exclude: []
