services:
  db:
    image: postgis/postgis:18-3.6
    env_file: [".env"]
    volumes: ["dbdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: [".env"]
    # Surcharge le POSTGRES_URL du .env (qui vise localhost) : ici la base est l'hôte `db`.
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      # Ports figés À L'INTÉRIEUR du conteneur, quoi que dise le `.env` : nginx y proxifie vers
      # `backend:8100`. Un dev qui déplace ses ports d'hôte ne doit pas casser la pile Docker.
      SERVER_PORT: 8100
      MANAGEMENT_SERVER_PORT: 9100
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    # Les DEUX ports sur la loopback : l'Actuator l'était déjà, l'API le devient. nginx joint le
    # backend par le réseau du compose (`backend:8100`), il n'a jamais eu besoin d'un port publié
    # — qui n'était qu'un contournement du rideau nginx offert à tout le réseau local.
    # Le backend reste joignable depuis la machine (curl, IntelliJ, scripts).
    ports: ["127.0.0.1:${SERVER_PORT:-8100}:8100", "127.0.0.1:${MANAGEMENT_SERVER_PORT:-9100}:9100"]
  frontend:
    build: ./frontend
    # Pas de `condition: service_healthy` : un `.env` incomplet fait boucler le backend
    # indéfiniment, et nginx ne démarrerait alors jamais — alors qu'il sait s'afficher seul avec
    # un bandeau « Plan en préparation » (acquis d'UX-1). Le nom DNS du conteneur suffit à nginx.
    depends_on: [backend]
    ports: ["8080:8080"]
volumes:
  dbdata:
