services:
  db:
    image: postgis/postgis:18-3.6
    env_file: [".env"]
    volumes: ["dbdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: [".env"]
    # Surcharge le POSTGRES_URL du .env (qui vise localhost) : ici la base est l'hôte `db`.
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    # L'Actuator (9000) n'est publié que sur la loopback : health `show-details: always` et
    # /metrics exposent version de PostgreSQL, URL JDBC et internes JVM. Reste joignable en
    # http://localhost:9000 depuis la machine, inatteignable depuis le réseau.
    ports: ["8000:8000", "127.0.0.1:9000:9000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  dbdata:
